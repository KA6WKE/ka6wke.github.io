AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Broken Labs - IAM Lab 04.
  An IAM role's permissions policy clearly allows reading an S3 bucket, but requests
  from the role are still being denied.
  Licensed under CC BY-NC-SA 4.0: https://creativecommons.org/licenses/by-nc-sa/4.0/
  Developed by: Mark Schoonover <mark.schoonover@gmail.com>

Resources:

  LabBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "brokenlabs-iam-lab-04-${AWS::Region}-${AWS::AccountId}"

  LabBoundaryPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "brokenlabs-iam-lab-04-boundary-${AWS::Region}-${AWS::AccountId}"
      Description: Permissions boundary applied to brokenlabs IAM lab-04 role
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: BoundaryAllowedActions
            Effect: Allow
            Action:
              - s3:ListBucket  # THE BREAK: should also include s3:GetObject to match the role's identity policy
            Resource:
              - !GetAtt LabBucket.Arn
              - !Sub "${LabBucket.Arn}/*"

  LabRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "brokenlabs-iam-lab-04-role-${AWS::Region}-${AWS::AccountId}"
      PermissionsBoundary: !Ref LabBoundaryPolicy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LabRolePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowBucketRead
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                Resource:
                  - !GetAtt LabBucket.Arn
                  - !Sub "${LabBucket.Arn}/*"

Outputs:

  RoleName:
    Description: Name of the IAM role to test in the Policy Simulator (s3:GetObject should be denied until fixed)
    Value: !Ref LabRole

  TestResourceArn:
    Description: Resource ARN to simulate s3:GetObject against
    Value: !Sub "${LabBucket.Arn}/*"

  BucketName:
    Description: Name of the S3 bucket
    Value: !Ref LabBucket

  BoundaryPolicyArn:
    Description: ARN of the permissions boundary attached to the role
    Value: !Ref LabBoundaryPolicy
